<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · 中V歌曲故事</title>
  <!--
    TECH_DESIGN §6：直接访问不存在的路径时，GitHub Pages 指向本页。
    注意：Pages 会把 404.html 渲染在任意缺失路径下（如 /8102coming-soon/foo/bar），
    相对路径的外部文件会失效，因此本页样式全部内联、不引外部 css/js。
    站点若改名/换仓库，需同步修改下方两处 /8102coming-soon/ 链接。
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0e1a;
      color: #c8d3e8;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 420px; }
    .code {
      font-size: 88px;
      font-weight: 700;
      color: #4a7dff;
      letter-spacing: 8px;
      line-height: 1;
      text-shadow: 0 0 32px rgba(74, 125, 255, 0.45);
    }
    h1 { font-size: 22px; margin: 20px 0 10px; color: #eef2fb; }
    p  { font-size: 14px; line-height: 1.8; color: #8a97b5; }
    a.btn {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 32px;
      border-radius: 999px;
      background: rgba(74, 125, 255, 0.14);
      border: 1px solid rgba(74, 125, 255, 0.4);
      color: #9db9ff;
      text-decoration: none;
      font-size: 15px;
    }
    a.btn:hover { background: rgba(74, 125, 255, 0.26); }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>雨太大，这条路被冲走了</h1>
    <p>你访问的页面不存在——可能是链接输错了，<br>或者故事还没写到这一页。</p>
    <a class="btn" href="/8102coming-soon/">← 返回首页听故事</a>
  </main>
</body>
</html>
