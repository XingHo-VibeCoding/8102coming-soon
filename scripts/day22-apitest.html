<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Day 22 · 增改删查闭环联调（本地假后端）</title>
<style>
  body { margin:0; padding:28px 34px 40px; background:#fafaf7; color:#1b1b1f;
         font:14px/1.7 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  h1 { font-size:20px; margin:0 0 6px; }
  .sub { color:#5b5b66; font-size:13px; margin-bottom:18px; }
  .step { background:#fff; border:1px solid #e3e3e8; border-radius:12px;
          padding:12px 16px; margin-bottom:10px; }
  .step .t { font-weight:600; margin-bottom:2px; }
  .step .r { font-size:13px; color:#5b5b66; word-break:break-all; }
  .step.pass { border-color:#bfe3cd; }
  .step.pass .t { color:#1f7a4d; }
  .step.fail { border-color:#e7b3ae; }
  .step.fail .t { color:#b3261e; }
</style>
</head>
<body>
  <h1>增改删查闭环联调</h1>
  <div class="sub">
    走的是 <code>js/api.js</code> 里真实的 <code>Api.*</code> 方法，后端是本地假 PostgREST
    （<code>scripts/mockserver.py</code>，按契约实现，内存态）。联调通过后再由站长执行
    <code>005_update_delete.sql</code> 接真库。
  </div>
  <div id="steps"></div>
  <script src="../js/api.js"></script>
  <script>
    const UID = "u_test_day22";
    const SONG = "xiafeng";
    const box = document.getElementById("steps");

    function step(title, pass, detail) {
      const div = document.createElement("div");
      div.className = "step " + (pass ? "pass" : "fail");
      div.innerHTML = `<div class="t">${pass ? "✓" : "✗"} ${title}</div><div class="r">${detail}</div>`;
      box.appendChild(div);
      return div;
    }
    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const show = (j) => esc(JSON.stringify(j));

    (async function run() {
      // 把接口地址临时指到本地假后端（只改这一个页面，不动 api.js）
      API_BASE.url = location.origin + "/__full";

      // ① 增
      const a = await Api.addFavorite(UID, SONG);
      step("① 增：POST add_favorite", a.ok === true, show(a));

      // ② 改：先改，再读明细核对（前后对比）
      const u1 = await Api.updateFavoriteNote(UID, SONG, "测试-改");
      const d1 = await Api.getFavoriteDetail(UID);
      const row1 = (d1.data || []).find((x) => x.song_id === SONG);
      step("② 改：PATCH update_favorite_note → 「测试-改」",
           u1.ok === true && row1 && row1.note === "测试-改",
           `改返回 ${show(u1)}；读回明细 note = ${show(row1 && row1.note)}`);

      // ②b 再改成空 = 清空
      const u2 = await Api.updateFavoriteNote(UID, SONG, "");
      const d2 = await Api.getFavoriteDetail(UID);
      const row2 = (d2.data || []).find((x) => x.song_id === SONG);
      step("②b 改：备注改回空 = 清空",
           u2.ok === true && row2 && (row2.note === null || row2.note === ""),
           `读回明细 note = ${show(row2 && row2.note)}`);

      // ②c 防呆：改一条不存在的收藏
      const u3 = await Api.updateFavoriteNote(UID, "bu-cun-zai", "x");
      step("②c 防呆：改不存在的收藏 → 明确中文错误，不静默成功",
           u3.ok === false && /收藏不存在/.test(u3.error || ""),
           show(u3));

      // ③ 删
      const d = await Api.deleteFavorite(UID, SONG);
      const g = await Api.getFavorites(UID);
      step("③ 删：DELETE delete_favorite → GET 里不再返回",
           d.ok === true && Array.isArray(g.data) && g.data.indexOf(SONG) === -1,
           `删返回 ${show(d)}；读回收藏列表 ${show(g.data)}`);

      // ③b 防呆：删一条不存在的
      const d2x = await Api.deleteFavorite(UID, SONG);
      step("③b 防呆：删不存在的收藏 → 明确中文错误（missing）",
           d2x.ok === false && /不存在或已被删除/.test(d2x.error || "") && d2x.data && d2x.data.missing === true,
           show(d2x));

      // ④ 查：明细为空列表
      const d3 = await Api.getFavoriteDetail(UID);
      step("④ 查：删除后明细为空数组", d3.ok === true && Array.isArray(d3.data) && d3.data.length === 0,
           show(d3));
    })();
  </script>
</body>
</html>
